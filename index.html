<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6f5f2">
<title>Linux in HTML · 浏览器里的桌面 Debian</title>
<link rel="icon" href="assets/icons/logo.svg">
<link rel="stylesheet" href="assets/css/desktop.css">
<link rel="stylesheet" href="assets/css/lih.css">
</head>
<body class="booting">

<div id="boot" aria-label="正在启动">
  <div class="boot-inner">
    <svg class="boot-logo" viewBox="0 0 96 96" aria-hidden="true">
      <rect class="bl-tile" x="3" y="3" width="90" height="90" rx="21"/>
      <rect class="bl-frame" x="20" y="25" width="56" height="46" rx="9"/>
      <path class="bl-bar" d="M20 36.5h56"/>
      <circle class="bl-dot" cx="27.5" cy="31" r="1.9"/>
      <circle class="bl-dot dim" cx="33.5" cy="31" r="1.9"/>
      <path class="bl-chev" d="M31.5 47.5l8.5 7-8.5 7"/>
      <rect class="bl-cursor" x="45" y="58" width="15" height="4.4" rx="2.2"/>
    </svg>
    <div class="boot-name">Linux in HTML</div>
    <div class="boot-sub">Debian 12 · Linux 6.1 · i386</div>
    <div class="boot-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="boot-bar"><i id="boot-progress"></i></div>
    <div class="boot-phase" id="boot-phase">正在准备…</div>
    <div class="boot-log" id="boot-log" hidden>
      <div class="bl-head"><span>ttyS0 · 串口实时输出（可选中复制、可向上滚动）</span><span class="bl-hint">引导中</span></div>
      <div class="bl-term" id="bl-term"></div>
    </div>
    <div class="boot-actions" id="boot-actions" hidden>
      <button id="boot-retry" class="boot-btn">重新加载</button>
      <button id="boot-skip" class="boot-btn ghost">跳过动画</button>
    </div>
  </div>
</div>

<div id="desktop" class="wp-1">
  <header id="topbar">
    <button class="tb-btn" id="tb-activities">活动</button>
    <span class="tb-app" id="tb-app">桌面</span>
    <div class="tb-center" id="tb-clock">--:--</div>
    <div class="tb-right">
      <span class="tb-kernel" id="tb-kernel"></span>
      <button class="tb-icon" id="tb-theme" title="切换亮色 / 暗色主题"><svg aria-hidden="true"><use href="assets/icons/sprite.svg#i-moon"/></svg></button>
      <button class="tb-icon" id="tb-network" title="网络与磁盘"><svg aria-hidden="true"><use href="assets/icons/sprite.svg#i-network"/></svg></button>
      <button class="tb-icon" id="tb-volume" title="扬声器"><svg aria-hidden="true"><use href="assets/icons/sprite.svg#i-volume"/></svg></button>
      <button class="tb-icon" id="tb-power" title="电源"><svg aria-hidden="true"><use href="assets/icons/sprite.svg#i-power"/></svg></button>
      <span class="tb-dot" id="tb-dot"></span>
    </div>
  </header>

  <div class="boot-error" id="boot-error" hidden>
    <span class="be-msg"></span>
    <button id="boot-error-retry">重新加载</button>
    <button id="boot-error-diag">诊断</button>
  </div>

  <div id="activities" class="pop" hidden></div>

  <div id="powermenu" class="pop" hidden>
    <button data-act="restart">重启虚拟机</button>
    <button data-act="clear-disk">清除磁盘改动…</button>
    <button data-act="diag">启动诊断</button>
    <button data-act="about">系统设置</button>
    <div class="pop-sep"></div>
    <div class="pop-note">关闭浏览器标签页即可退出</div>
  </div>

  <div id="netmenu" class="pop lih-netmenu" hidden>
    <div class="lih-net-title">网络中继（WISP）</div>
    <input id="net-wisp" class="lih-net-input" spellcheck="false" autocomplete="off" placeholder="wss://your-relay.example/wisp/">
    <div class="lih-net-row">
      <span class="badge" id="net-relay-badge">未连接</span>
      <span class="badge" id="net-guest-badge">guest 网络：未配置</span>
    </div>
    <button data-act="reconnect">保存并重连</button>
    <button data-act="guest-net">立即配置 guest 网络</button>
    <button data-act="clear-disk">清除磁盘改动…</button>
    <div class="pop-sep"></div>
    <div class="pop-note" id="net-note">本机默认使用自己 server.js 的 /wisp/ 中继</div>
  </div>

  <div id="windows"></div>
  <div id="screen-holder" hidden>
    <div id="screen_container"><div id="screen"></div><canvas id="vga"></canvas></div>
  </div>
  <nav id="dock" aria-label="应用"></nav>
</div>

<div id="diag" hidden>
  <div class="diag-box">
    <div class="diag-head"><b>启动诊断</b><button id="diag-close">关闭</button></div>
    <div class="diag-body" id="diag-body"></div>
  </div>
</div>

<div id="switcher" hidden></div>
<div id="toasts"></div>

<noscript><p style="padding:24px;font:15px system-ui">这个页面需要 JavaScript 才能启动虚拟机。</p></noscript>

<script src="lib/v86.js"></script>
<script src="assets/js/term.js"></script>
<script src="assets/js/bridge.js"></script>
<script src="assets/js/wm.js"></script>
<script src="assets/js/apps.js"></script>
<script src="assets/js/extras.js"></script>
<script src="assets/js/anim.js"></script>
<script src="assets/js/boot.js"></script>
</body>
</html>
